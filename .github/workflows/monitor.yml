name: Monitor Fujiya AVIC arrivals

on:
  schedule:
    # GitHub Actions is busiest at round-number minute marks. Keep the
    # ten-minute interval while shifting away from :00, :10, :20, ...
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        default: monitor
        type: choice
        options:
          - monitor
          - bot-test
          - product-notify
      product-id:
        description: "単品通知する12桁の商品ID（product-notifyのみ）"
        required: false
        type: string
      page-number:
        description: "範囲通知する一覧ページ番号（product-notifyのみ）"
        required: false
        type: string
      through-product-id:
        description: "ページ先頭からこの商品IDまで通知（product-notifyのみ）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fujiya-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.MONITOR_ENABLED == 'true' && vars.CLOUDFLARE_SCHEDULER_ENABLED != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --production

      - name: Monitor arrivals
        if: github.event_name == 'schedule' || inputs.mode == 'monitor'
        run: bun run start
        env:
          NOTIFIER_API_URL: ${{ secrets.NOTIFIER_API_URL }}
          NOTIFIER_API_TOKEN: ${{ secrets.NOTIFIER_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Test Discord notification
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'bot-test'
        run: bun run bot:test
        env:
          NOTIFIER_API_URL: ${{ secrets.NOTIFIER_API_URL }}
          NOTIFIER_API_TOKEN: ${{ secrets.NOTIFIER_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify one product
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'product-notify'
        run: bun run notify:product
        env:
          PRODUCT_ID: ${{ inputs.product-id }}
          PAGE_NUMBER: ${{ inputs.page-number }}
          THROUGH_PRODUCT_ID: ${{ inputs.through-product-id }}
          NOTIFIER_API_URL: ${{ secrets.NOTIFIER_API_URL }}
          NOTIFIER_API_TOKEN: ${{ secrets.NOTIFIER_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit updated product state
        if: github.event_name == 'schedule' || inputs.mode == 'monitor'
        run: |
          if git diff --quiet -- data/seen-products.json; then
            echo "No state change"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen-products.json
          git commit -m "chore: update seen products"
          git pull --rebase origin main
          git push origin HEAD:main
