name: Monitor Fujiya AVIC arrivals

on:
  schedule:
    # GitHub Actions is busiest at round-number minute marks. Keep the
    # ten-minute interval while shifting away from :00, :10, :20, ...
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        default: monitor
        type: choice
        options:
          - monitor
          - webhook-test

permissions:
  contents: write

concurrency:
  group: fujiya-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Monitor arrivals
        if: github.event_name == 'schedule' || inputs.mode == 'monitor'
        run: npm start
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Test Discord webhook
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'webhook-test'
        run: npm run webhook:test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit updated product state
        if: github.event_name == 'schedule' || inputs.mode == 'monitor'
        run: |
          if git diff --quiet -- data/seen-products.json; then
            echo "No state change"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen-products.json
          git commit -m "chore: update seen products"
          git pull --rebase origin main
          git push origin HEAD:main
